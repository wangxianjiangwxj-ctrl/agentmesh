<!DOCTYPE html>
<html lang="zh-CN" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentMesh Admin — Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background: #0f172a; min-height: 100vh; display: flex; align-items: center; }
  .login-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 2rem; max-width: 420px; margin: 0 auto; }
  .login-card h2 { color: #e2e8f0; margin-bottom: 1.5rem; }
  .form-label { color: #94a3b8; }
  .form-control { background: #0f172a; border-color: #334155; color: #e2e8f0; }
  .form-control:focus { background: #0f172a; border-color: #38bdf8; color: #e2e8f0; box-shadow: 0 0 0 0.2rem rgba(56, 189, 248, 0.25); }
  .alert { background: rgba(248, 113, 113, 0.1); border-color: rgba(248, 113, 113, 0.3); color: #f87171; }
</style>
</head>
<body>
<div class="container">
  <div class="login-card">
    <h2 class="text-center">🔐 AgentMesh</h2>
    <p class="text-muted text-center mb-4">Admin Login</p>
    {% if error %}
    <div class="alert" role="alert">{{ error }}</div>
    {% endif %}
    <form method="POST" action="/admin/login">
      {{ csrf_input(request) | safe }}
      <div class="mb-3">
        <label class="form-label">API Key</label>
        <input type="password" class="form-control" name="api_key" placeholder="amk_v1_..." required>
      </div>
      <button type="submit" class="btn btn-primary w-100" style="background:#38bdf8;border:none;">Login</button>
    </form>
    <p class="text-muted text-center mt-3" style="font-size:0.85rem;">
      First time? Run <code>agentmesh auth create-admin</code> to get your admin API key.
    </p>
  </div>
</div>
</body>
</html>
