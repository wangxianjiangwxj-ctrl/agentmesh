<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentMesh Admin &mdash; {{ page_title }}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
  :root { --bg: #0f172a; --card: #1e293b; --border: #334155; --text: #e2e8f0; --muted: #94a3b8; --accent: #38bdf8; --green: #4ade80; }
  body { background: #0f172a; color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
  .sidebar { width: 200px; background: #1e293b; border-right: 1px solid var(--border); height: 100vh; position: fixed; }
  .sidebar a { color: var(--muted); padding: 8px 16px; display: block; }
  .sidebar a:hover, .sidebar a.active { color: var(--text); background: rgba(56,189,248,0.1); }
  .content { margin-left: 200px; padding: 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .badge-status { padding: 2px 8px; border-radius: 999px; font-size: 0.8rem; }
  .badge-active { background: rgba(74,222,128,0.15); color: var(--green); }
  .badge-pending { background: rgba(251,191,36,0.15); color: #fbbf24; }
  .badge-suspended { background: rgba(248,113,113,0.15); color: #f87171; }
  .metric { text-align: center; padding: 12px; background: rgba(56,189,248,0.06); border-radius: 8px; }
  .metric .val { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
  .metric .lbl { font-size: 0.8rem; color: var(--muted); }
  table { width: 100%; font-size: 0.9rem; }
  th { color: var(--muted); font-weight: 500; padding: 8px 6px; border-bottom: 1px solid var(--border); text-align: left; }
  td { padding: 8px 6px; border-bottom: 1px solid var(--border); }
  tr:hover { background: rgba(56,189,248,0.05); }
  .btn-sm { font-size: 0.8rem; padding: 2px 8px; }
  .logout { float: right; color: var(--muted); text-decoration: none; font-size: 0.85rem; }
  .logout:hover { color: #f87171; }
</style>
</head>
<body>
<div class="sidebar">
  <div style="padding:16px;"><i class="bi bi-grid-3x3-gap-fill me-2"></i><strong>AgentMesh</strong>
    <a href="/admin/logout" class="logout"><i class="bi bi-box-arrow-right"></i></a>
  </div>
  <hr style="border-color:var(--border);margin:0;">
  <a href="/admin/" class="{% if request.url.path == '/admin/' %}active{% endif %}"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
  <a href="/admin/agents" class="{% if request.url.path == '/admin/agents' %}active{% endif %}"><i class="bi bi-people me-2"></i>Agents</a>
  <a href="/admin/tasks" class="{% if request.url.path == '/admin/tasks' %}active{% endif %}"><i class="bi bi-list-task me-2"></i>Tasks</a>
  <a href="/admin/escrow" class="{% if request.url.path == '/admin/escrow' %}active{% endif %}"><i class="bi bi-wallet2 me-2"></i>Escrow</a>
  <a href="/admin/companies" class="{% if '/admin/companies' in request.url.path %}active{% endif %}"><i class="bi bi-building me-2"></i>Companies</a>
  <a href="/admin/equity" class="{% if '/admin/equity' in request.url.path %}active{% endif %}"><i class="bi bi-pie-chart me-2"></i>Equity</a>
  <a href="/admin/dividends" class="{% if '/admin/dividends' in request.url.path %}active{% endif %}"><i class="bi bi-cash-coin me-2"></i>Dividends</a>
  <a href="/admin/proposals" class="{% if '/admin/proposals' in request.url.path %}active{% endif %}"><i class="bi bi-file-earmark-text me-2"></i>Governance</a>
</div>
<div class="content">
  <h3 style="margin-bottom:20px;">{{ page_title }}</h3>
  {% block content %}{% endblock %}
</div>
</body>
</html>
