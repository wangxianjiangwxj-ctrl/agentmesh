# AgentMesh 文档站自动部署
# 在 main 分支 push 时自动构建并部署到 GitHub Pages
# 使用 gh-pages 分支承载静态文件

name: Docs Deploy

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "agentmesh/**"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  # 允许手动触发
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            mkdocs \
            mkdocs-material \
            mkdocs-macros-plugin \
            mkdocstrings[python] \
            mkdocs-gen-files

      - name: Install project (for API reference generation)
        run: |
          pip install -e .

      - name: Build documentation
        run: mkdocs build --strict

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
