[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "agentmesh"
version = "0.4.0"
description = "AgentMesh - Multi-agent orchestration framework"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["agentmesh*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: End-to-end integration tests (slow)",
    "unit: Unit tests (fast)",
]
