[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "agentmesh"
version = "0.4.0"
description = "AgentMesh - Multi-agent orchestration framework with A2A protocol"
readme = "README.md"
license = {text = "MIT"}
keywords = ["agent", "multi-agent", "a2a", "orchestration", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "cryptography>=39.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "build>=1.0",
]
server = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
]

[project.urls]
Homepage = "https://agentmesh.ai"
Repository = "https://github.com/openagentmesh/agentmesh"
Documentation = "https://agentmesh.ai/docs"

[project.scripts]
agentmesh = "agentmesh.a2a_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentmesh*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: End-to-end integration tests (slow)",
    "unit: Unit tests (fast)",
]
